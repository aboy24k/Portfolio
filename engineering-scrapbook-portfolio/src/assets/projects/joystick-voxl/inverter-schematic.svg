<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 270" width="560" height="270" role="img" aria-labelledby="t">
  <title id="t">Transistor inverter: 2N2222 with a 1.8 kilohm pull-up and a 1 kilohm base resistor</title>
  <rect width="560" height="270" fill="#fffefb"/>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#1e293b">
    <!-- 5V rail through R1 to the collector node -->
    <text x="18" y="58">5V</text>
    <path d="M48 54H120" stroke="#1e293b" stroke-width="2" fill="none"/>
    <path d="M120 54l8 0 6 -9 12 18 12 -18 12 18 12 -18 6 9 8 0" stroke="#1e293b" stroke-width="2" fill="none" stroke-linejoin="round"/>
    <path d="M196 54H340" stroke="#1e293b" stroke-width="2" fill="none"/>
    <text x="146" y="34">R1 1.8K</text>
    <!-- output -->
    <circle cx="340" cy="54" r="4.5" fill="#1e293b"/>
    <path d="M340 54H470" stroke="#e8590c" stroke-width="2" fill="none"/>
    <path d="M470 54l-9 -5v10z" fill="#e8590c"/>
    <text x="352" y="38" fill="#e8590c">to VOXL SBUS in</text>
    <!-- collector down to transistor -->
    <path d="M340 54V128" stroke="#1e293b" stroke-width="2" fill="none"/>
    <!-- transistor: base bar, collector, emitter -->
    <path d="M300 138V192" stroke="#1e293b" stroke-width="3.5" fill="none"/>
    <path d="M300 155L340 128" stroke="#1e293b" stroke-width="2" fill="none"/>
    <path d="M300 176L340 203V232" stroke="#1e293b" stroke-width="2" fill="none"/>
    <path d="M340 203l-15 -3 5 -10z" fill="#1e293b" transform="rotate(0)"/>
    <text x="356" y="172">Q 2N2222</text>
    <!-- base input through R2 -->
    <text x="18" y="169" fill="#1d5fd1">Arduino</text>
    <text x="18" y="185" fill="#1d5fd1">TX pin</text>
    <path d="M84 165H130" stroke="#1d5fd1" stroke-width="2" fill="none"/>
    <path d="M130 165l8 0 6 -9 12 18 12 -18 12 18 12 -18 6 9 8 0" stroke="#1e293b" stroke-width="2" fill="none" stroke-linejoin="round"/>
    <path d="M206 165H300" stroke="#1e293b" stroke-width="2" fill="none"/>
    <text x="156" y="142">R2 1K</text>
    <!-- ground rail -->
    <path d="M60 232H470" stroke="#1e293b" stroke-width="2" fill="none"/>
    <circle cx="340" cy="232" r="4.5" fill="#1e293b"/>
    <text x="18" y="236">GND</text>
    <text x="60" y="258" fill="#59657a" font-size="12">TX high pulls the output low, and the reverse</text>
  </g>
</svg>
